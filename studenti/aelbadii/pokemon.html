<html>
    <body>
        <button onClick="fetchApi()">Scarica Pokemon</button>
        <ul id="lista-pokemon"></ul>

        <input type="text" id="nome-pokemon" placeholder="Nome o ID">
        <button onClick="fetchPokemon()">Cerca Pokemon</button>
        <div id="risultato-pokemon" style="margin-top: 20px;"></div>
        <button id="btn-aggiungi" onClick="aggiungiAlPokedex()" style="display: none;">Aggiungi al Pokédex</button>
        
        <div id="pokedex-container" style="margin-top: 20px;">
            <h3>Il mio Pokédex</h3>
            <ul id="pokedex"></ul>
        </div>
    </body>
    <script>
       const fetchApi=() => {
           fetch("https://pokeapi.co/api/v2/pokemon?limit=10&offset=0")
           .then((response)=> {
            console.log(response);
            return response.json();
            })
           .then((data)=>{
            const lista = document.getElementById("lista-pokemon");
            lista.innerHTML = ""; // Svuota la lista prima di riempirla
            data.results.forEach((pokemon) => {
                const li = document.createElement("li");
                li.textContent = pokemon.name;
                lista.appendChild(li);
            });
           })
           .catch((error)=>{
            console.log(error);
           })
       }
       let currentPokemon = null; // Variabile per tenere traccia del Pokémon attualmente mostrato

       const fetchPokemon=()=> {
        const nomePokemon = document.getElementById("nome-pokemon").value.trim().toLowerCase();
        const risultatoContainer = document.getElementById("risultato-pokemon");
        const btnAggiungi = document.getElementById("btn-aggiungi");

        if (!nomePokemon) {
            risultatoContainer.innerHTML = "<p style='color:red;'>Per favore, inserisci un nome o un ID!</p>";
            btnAggiungi.style.display = "none";
            return;
        }

        fetch("https://pokeapi.co/api/v2/pokemon/" + nomePokemon)
        .then((response)=>{
            if (!response.ok) {
                throw new Error("Pokémon non trovato!");
            }
            return response.json();
        })
        .then((data)=>{
           
            currentPokemon = data;
            
            risultatoContainer.innerHTML = `
                <h3>${data.name.toUpperCase()} (#${data.id})</h3>
                <img src="${data.sprites.front_default}" alt="${data.name}">
                <p>Altezza: ${data.height / 10} m</p>
                <p>Peso: ${data.weight / 10} kg</p>
            `;
            // Mostriamo il bottone per aggiungerlo al pokedex
            btnAggiungi.style.display = "inline-block";
        })
        .catch((error)=>{
            risultatoContainer.innerHTML = `<p style="color:red;">Errore: ${error.message}</p>`;
            btnAggiungi.style.display = "none";
        })
       }

       const aggiungiAlPokedex = () => {
           if (!currentPokemon) return;

           const pokedexLista = document.getElementById("pokedex");
           
           // Creiamo un elemento lista per il Pokémon catturato
           const li = document.createElement("li");
           li.textContent = `${currentPokemon.name.toUpperCase()} (#${currentPokemon.id})`;
           
           // Aggiungiamo anche una piccola immagine vicino al nome
           const img = document.createElement("img");
           img.src = currentPokemon.sprites.front_default;
           img.style.width = "50px";
           img.style.verticalAlign = "middle";
           
           li.prepend(img); // Aggiunge l'immagine all'inizio dell'elemento <li>
           
           pokedexLista.appendChild(li);
       }
       
    </script>
</html>
